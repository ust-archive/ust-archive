name: Update Credit Transfer Data

on:
  schedule:
    # "At 20:21." (UTC)
    # "At 04:21." (HKT)
    - cron: "21 20 * * *"

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v5

      - name: Check Hugging Face access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ust-archive/credit-transfer
        run: |
          if [[ -z "${HF_TOKEN//[[:space:]]/}" ]]; then
            echo "::error::HF_TOKEN is missing or blank"; exit 1
          fi
          for check in whoami-v2 "datasets/$HF_DATASET/auth-check" "datasets/$HF_DATASET/auth-check/write"; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 --header "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/api/$check") || {
              echo "::error::Hugging Face network/TLS failure"; exit 1
            }
            case "$check:$status" in
              *:2??) continue ;;
              whoami-v2:401) reason="authentication failed" ;;
              *:401|*:403) reason="access denied; check token scopes and organization policy" ;;
              *:404) reason="resource missing or inaccessible" ;;
              *:429) reason="rate limited" ;;
              *:5??) reason="service unavailable" ;;
              *) reason="unexpected response" ;;
            esac
            echo "::error::Hugging Face $check: $reason (HTTP $status)"; exit 1
          done

      - uses: actions/checkout@v6
        with:
          repository: "ust-archive/ust-cc"
          token: ${{ secrets.GH_TOKEN }}

      - name: Pull Credit Transfer Data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        working-directory: packages/updater
        run: |
          uvx hf download --repo-type dataset ust-archive/credit-transfer --local-dir import_data

      - name: Update Credit Transfer Data
        env:
          UST_EMAIL: ${{ secrets.UST_EMAIL }}
        working-directory: packages/updater
        run: |
          bun install --production
          bun go credit-transfer --input import_data --output export_data

      - name: Push Credit Transfer Data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        working-directory: packages/updater
        run: |
          uvx hf upload --repo-type dataset ust-archive/credit-transfer export_data . --commit-message "update(v0): $(TZ='Asia/Hong_Kong' date --iso-8601=seconds)"
